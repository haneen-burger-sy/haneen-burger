<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم حنين برغر | المنيو والطلب السريع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e63946;
      --accent: #f4a261;
      --bg: #111113;
      --card-bg: #1c1c21;
      --text: #ffffff;
      --text-muted: #a0a0aa;
      --border: #2e2e38;
      --success: #25d366;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }
    header {
      background: linear-gradient(180deg, rgba(230, 57, 70, 0.25) 0%, rgba(17, 17, 19, 0.95) 100%), #16161a;
      text-align: center;
      padding: 30px 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      display: inline-block;
      background: rgba(244, 162, 97, 0.15);
      color: var(--accent);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
      border: 1px solid rgba(244, 162, 97, 0.3);
    }
    header h1 {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 6px;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .categories-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(17, 17, 19, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #23232b;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 30px;
      white-space: nowrap;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 16px;
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin: 20px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title span {
      background: var(--primary);
      width: 4px;
      height: 20px;
      border-radius: 4px;
      display: inline-block;
    }
    .items-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--border);
    }
    .item-img {
      width: 85px;
      height: 85px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .item-details { flex-grow: 1; }
    .item-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
    .item-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .item-price { color: var(--accent); font-weight: 800; font-size: 0.95rem; }
    .qty-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .btn-qty {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: #2e2e3a;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-qty.plus { background: var(--primary); }
    .qty-display { font-weight: 700; font-size: 1rem; min-width: 18px; text-align: center; }
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #18181e;
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      max-width: 650px;
      margin: 0 auto;
    }
    .cart-count { font-size: 0.85rem; color: var(--text-muted); }
    .cart-total { font-size: 1.15rem; font-weight: 900; color: var(--accent); }
    .btn-checkout {
      background: var(--success);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #1c1c24;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      padding: 22px 20px 30px;
      border-top: 2px solid var(--primary);
    }
    .modal-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 14px; text-align: center; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      background: #252530;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn-confirm { flex: 2; background: var(--success); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; }
    .btn-cancel { flex: 1; background: #2e2e3a; color: #ddd; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  </style>
</head>

    <h1>مطعم حنين برغر</h1>
    <p>الطعم اللي يرضيك • أهلاً وسهلاً بكم</p>

  <div class="categories-bar">

    <button class="cat-btn" onclick="filterCategory('meals')">🍟 الوجبات</button>
    <button class="cat-btn" onclick="filterCategory('sandwiches')">🥖 السندويشات</button>
  </div>

  <div class="container" id="menu-container"></div>

  <div class="cart-bar" id="cart-bar" style="display: none;">

      <span class="cart-count" id="cart-count">0 وجبات</span>
      <span class="cart-total" id="cart-total">0 ل.س</span>
    </div>
    <button class="btn-checkout" onclick="openCheckoutModal()">
      <span>إتمام الطلب عبر واتساب 💬</span>
    </button>
  </div>

  <div class="modal-overlay" id="checkout-modal">
    <div class="modal-content">
      <h3 class="modal-title">تفاصيل الطلب والتوصيل</h3>
      <div class="form-group">
        <label>اسم الزبون الكريم *</label>
        <input type="text" id="cust-name" placeholder="أدخل اسمك" required>
      </div>
      <div class="form-group">
        <label>العنوان / رقم الطاولة أو سفري *</label>
        <input type="text" id="cust-address" placeholder="مثال: سرمدا - أو طاولة 3" required>
      </div>
      <div class="form-group">
        <label>ملاحظات إضافية على الطلب</label>
        <textarea id="cust-notes" rows="2" placeholder="مثلاً: بدون مخلل، زيادة ثومية..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-confirm" onclick="sendOrderToWhatsApp()">إرسال الطلب الآن 🚀</button>
        <button class="btn-cancel" onclick="closeCheckoutModal()">رجوع</button>
      </div>
    </div>
  </div>
