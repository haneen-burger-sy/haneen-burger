<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم حنين برغر | Haneen Burger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e63946;
      --primary-hover: #d62828;
      --dark: #1d3557;
      --light-bg: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #2b2d42;
      --text-muted: #6c757d;
      --border-color: #edf2f4;
      --radius: 14px;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--light-bg);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 110px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1d3557 0%, #0d1b2a 100%);
      color: white;
      text-align: center;
      padding: 24px 16px 20px;
      border-radius: 0 0 26px 26px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .header-logo {
      width: 86px;
      height: 86px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e63946;
      border: 3px solid #ffb703;
      border-radius: 50%;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }

    .header-logo svg {
      width: 52px;
      height: 52px;
      fill: #ffffff;
    }

    .badge-top {
      display: inline-block;
      background: rgba(230, 57, 70, 0.25);
      color: #ffb703;
      border: 1px solid rgba(255, 183, 3, 0.4);
      padding: 3px 14px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 1.85rem;
      font-weight: 900;
      margin-bottom: 4px;
    }

    header p {
      color: #e0e1dd;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    /* Currency Switcher */
    .currency-switch {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.12);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .currency-btn {
      background: none;
      border: none;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .currency-btn.active {
      background: #ffb703;
      color: #1d3557;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Category Filter */
    .categories-bar {
      display: flex;
      gap: 8px;
      padding: 16px 12px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Products Grid */
    .section-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--dark);
      margin: 14px 14px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 10px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      position: relative;
    }

    .card-top {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card-img {
      width: 62px;
      height: 62px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: #eee;
    }

    .card-info {
      flex: 1;
      overflow: hidden;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed #edf2f4;
      padding-top: 8px;
      margin-top: auto;
    }

    .card-price {
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--primary);
    }

    .add-btn {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-btn:active {
      background: var(--primary);
      color: #ffffff;
      transform: scale(0.95);
    }

    /* Floating Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: #1d3557;
      color: #ffffff;
      border-radius: 16px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 1000;
      transition: transform 0.3s ease;
    }

    .cart-summary {
      display: flex;
      flex-direction: column;
    }

    .cart-count {
      font-size: 0.78rem;
      color: #ffb703;
      font-weight: 700;
    }

    .cart-total {
      font-size: 1.05rem;
      font-weight: 900;
    }

    .order-btn {
      background: #25d366;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C7.58 2 4 4.79 4 8c0 .28.03.55.08.82C2.84 9.4 2 10.6 2 12c0 1.66 1.34 3 3 3h14c1.66 0 3-1.34 3-3 0-1.4-.84-2.6-2.08-3.18.05-.27.08-.54.08-.82 0-3.21-3.58-6-8-6zm0 2c3.42 0 6.18 2.06 6.84 4.78-.28.08-.55.18-.81.3-1.46-.68-3.66-1.08-6.03-1.08s-4.57.4-6.03 1.08c-.26-.12-.53-.22-.81-.3C5.82 6.06 8.58 4 12 4zm-7 8c-.55 0-1-.45-1-1s.45-1 1-1h14c.55 0 1 .45 1 1s-.45 1-1 1H5zm14 5c-.7 0-1.37.2-1.95.55-.58-.35-1.25-.55-1.95-.55s-1.37.2-1.95.55C13.57 17.2 12.9 17 12 17s-1.57.2-2.15.55C9.27 17.2 8.6 17 7.9 17s-1.37.2-1.95.55C5.37 17.2 4.7 17 4 17c-1.1 0-2 .9-2 2v1h20v-1c0-1.1-.9-2-2-2z"/>
      </svg>
    </div>
    <div class="badge-top">⭐ جودة ونكهة مميزة</div>
    <h1>مطعم حنين برغر</h1>
    <p>الطعم اللي يرضيك • أهلاً وسهلاً بكم</p>
    
    <div class="currency-switch">
      <button class="currency-btn active" id="btn-syp" onclick="changeCurrency('SYP')">🇸🇾 ليرة سورية</button>
      <button class="currency-btn" id="btn-tl" onclick="changeCurrency('TL')">🇹🇷 TL تركي</button>
    </div>
  </header>

  <!-- Categories Filter -->
  <div class="categories-bar">
    <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
    <button class="cat-btn" onclick="filterCategory('burger', this)">🍔 قسم البرغر</button>
    <button class="cat-btn" onclick="filterCategory('meals', this)">🍟 قسم الوجبات</button>
    <button class="cat-btn" onclick="filterCategory('sandwiches', this)">🌯 قسم السندويش</button>
    <button class="cat-btn" onclick="filterCategory('drinks', this)">🥤 المشروبات</button>
  </div>

  <!-- Menu Container -->
  <main id="menu-container"></main>

  <!-- Floating Cart Bar -->
  <div class="cart-bar" id="cartBar" style="display: none;">
    <div class="cart-summary">
      <span class="cart-count" id="cartCount">0 وجبات محددة</span>
      <span class="cart-total" id="cartTotal">0 ل.س</span>
    </div>
    <button class="order-btn" onclick="sendOrderWhatsApp()">
      <span>اطلب عبر واتساب</span>
      💬
    </button>
  </div>

  <script>
    let currentCurrency = 'SYP';
    let cart = [];

    const products = [
      // برغر
      { id: 1, cat: 'burger', name: 'برغر لحم', desc: 'لحم عجل طازج متبل مع الصوص والجبن السلس', syp: 690, tl: 150, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300&auto=format&fit=crop&q=80' },
      { id: 2, cat: 'burger', name: 'برغر جاج', desc: 'صدر دجاج مقرمش مع الجبنة والخس الطازج', syp: 540, tl: 120, img: 'https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?w=300&auto=format&fit=crop&q=80' },
      { id: 3, cat: 'burger', name: 'برغر تشيلي', desc: 'برغر بنكهة صوص التشيلي الحار الشهي', syp: 750, tl: 165, img: 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=300&auto=format&fit=crop&q=80' },
      { id: 4, cat: 'burger', name: 'برغر امريكانا', desc: 'برغر كلاسيك مميز على الطريقة الأمريكية', syp: 750, tl: 165, img: 'https://images.unsplash.com/photo-1550547660-d9450f859349?w=300&auto=format&fit=crop&q=80' },
      { id: 5, cat: 'burger', name: 'برغر مكس', desc: 'مزيج اللحم والدجاج مع الخضار والجبن الغني', syp: 825, tl: 180, img: 'https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?w=300&auto=format&fit=crop&q=80' },
      { id: 6, cat: 'burger', name: 'برغر زنجر', desc: 'فيليه دجاج زنجر حار ومقرمش مع الصوص', syp: 540, tl: 120, img: 'https://images.unsplash.com/photo-1606755962773-d324e0a13086?w=300&auto=format&fit=crop&q=80' },

      // وجبات
      { id: 7, cat: 'meals', name: 'وجبة فاهيتا', desc: 'دجاج فاهيتا مع البطاطا والمقبلات والصوص', syp: 750, tl: 165, img: 'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=300&auto=format&fit=crop&q=80' },
      { id: 8, cat: 'meals', name: 'وجبة مكسيكانو', desc: 'خلطة مكسيكانو حارة مع البطاطا والصوصات اللذيذة', syp: 660, tl: 145, img: 'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=300&auto=format&fit=crop&q=80' },
      { id: 9, cat: 'meals', name: 'وجبة كريسبي', desc: 'قطع كريسبي ذهبية مقرمشة مع كريم الثوم والبطاطا', syp: 660, tl: 145, img: 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=300&auto=format&fit=crop&q=80' },
      { id: 10, cat: 'meals', name: 'وجبة زنجر', desc: 'وجبة زنجر شهية مقرمشة مع بطاطا وسلطة وصوص', syp: 690, tl: 150, img: 'https://images.unsplash.com/photo-1562967914-608f82629710?w=300&auto=format&fit=crop&q=80' },
      { id: 11, cat: 'meals', name: 'وجبة سبايسي', desc: 'قطع مقرمشة بتتبيلة سبايسي حارة ونكهة مميزة', syp: 660, tl: 145, img: 'https://images.unsplash.com/photo-1527477378392-1c0ec6c60d3f?w=300&auto=format&fit=crop&q=80' },
      { id: 12, cat: 'meals', name: 'وجبة غواصة', desc: 'وجبة غواصة غنية بالجبن السائح مع البطاطا', syp: 750, tl: 165, img: 'https://images.unsplash.com/photo-1509722747041-616f39b57569?w=300&auto=format&fit=crop&q=80' },
      { id: 13, cat: 'meals', name: 'وجبة بطاطا', desc: 'صحن بطاطا مقلية كبير مقرمش مع الثوم والكاتشب', syp: 300, tl: 70, img: 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300&auto=format&fit=crop&q=80' },

      // سندويش
      { id: 14, cat: 'sandwiches', name: 'سندويشة كريسبي', desc: 'كريسبي دجاج مقرمش مع المايونيز والخس الطازج', syp: 330, tl: 75, img: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=300&auto=format&fit=crop&q=80' },
      { id: 15, cat: 'sandwiches', name: 'سندويشة سبايسي', desc: 'دجاج مقرمش متبل بخلطة حارة مع الصوص والمخلل', syp: 330, tl: 75, img: 'https://images.unsplash.com/photo-1603064752734-4c48eff53d05?w=300&auto=format&fit=crop&q=80' },
      { id: 16, cat: 'sandwiches', name: 'سندويشة غواصة', desc: 'سندويشة غواصة محشية غنية بالجبن السائح والبهارات', syp: 380, tl: 85, img: 'https://images.unsplash.com/photo-1621800043295-a73fe2f76e2c?w=300&auto=format&fit=crop&q=80' },
      { id: 17, cat: 'sandwiches', name: 'سندويشة بطاطا', desc: 'سندويشة بطاطا مقلية مقرمشة مع كريم الثوم والمخلل', syp: 150, tl: 35, img: 'https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?w=300&auto=format&fit=crop&q=80' },

      // مشروبات
      { id: 18, cat: 'drinks', name: 'ماء شرب', desc: 'عبوة مياه معدنية نقية وباردة', syp: 30, tl: 10, img: 'https://images.unsplash.com/photo-1548839140-29a749e1bc4e?w=300&auto=format&fit=crop&q=80' },
      { id: 19, cat: 'drinks', name: 'بيبسي', desc: 'علبة بيبسي كولا مثلجة ومنعشة', syp: 50, tl: 15, img: 'https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=300&auto=format&fit=crop&q=80' },
      { id: 20, cat: 'drinks', name: 'ميرندا', desc: 'ميرندا برتقال باردة ومنعشة', syp: 50, tl: 15, img: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300&auto=format&fit=crop&q=80' },
      { id: 21, cat: 'drinks', name: 'سفن أب', desc: 'سفن أب بنكهة الليمون المنعش', syp: 50, tl: 15, img: 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=300&auto=format&fit=crop&q=80' },
      { id: 22, cat: 'drinks', name: 'لبن عيران', desc: 'لبن عيران طازج وبارد ولذيذ', syp: 35, tl: 10, img: 'https://images.unsplash.com/photo-1528750997573-59b89d56f4f7?w=300&auto=format&fit=crop&q=80' }
    ];

    const categoryNames = {
      burger: '🍔 قسم البرغر',
      meals: '🍟 قسم الوجبات',
      sandwiches: '🌯 قسم السندويش',
      drinks: '🥤 المشروبات'
    };

    function renderMenu(filter = 'all') {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      const catsToRender = filter === 'all' ? ['burger', 'meals', 'sandwiches', 'drinks'] : [filter];

      catsToRender.forEach(cat => {
        const items = products.filter(p => p.cat === cat);
        if (items.length === 0) return;

        const titleDiv = document.createElement('div');
        titleDiv.className = 'section-title';
        titleDiv.textContent = categoryNames[cat];
        container.appendChild(titleDiv);

        const grid = document.createElement('div');
        grid.className = 'products-grid';

        items.forEach(item => {
          const price = currentCurrency === 'SYP' ? `${item.syp} ل.س` : `${item.tl} TL`;
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-top">
              <img src="${item.img}" class="card-img" alt="${item.name}" loading="lazy">
              <div class="card-info">
                <div class="card-title">${item.name}</div>
                <div class="card-desc">${item.desc}</div>
              </div>
            </div>
            <div class="card-bottom">
              <div class="card-price">${price}</div>
              <button class="add-btn" onclick="addToCart(${item.id})">+ إضافة</button>
            </div>
          `;
          grid.appendChild(card);
        });

        container.appendChild(grid);
      });
    }

    function changeCurrency(curr) {
      currentCurrency = curr;
      document.getElementById('btn-syp').classList.toggle('active', curr === 'SYP');
      document.getElementById('btn-tl').classList.toggle('active', curr === 'TL');
      renderMenu(window.currentFilter || 'all');
      updateCartUI();
    }

    function filterCategory(cat, btn) {
      window.currentFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMenu(cat);
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCartUI();
    }

    function updateCartUI() {
      const bar = document.getElementById('cartBar');
      if (cart.length === 0) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      document.getElementById('cartCount').textContent = `${cart.length} وجبة في السلة`;

      const total = cart.reduce((sum, item) => sum + (currentCurrency === 'SYP' ? item.syp : item.tl), 0);
      document.getElementById('cartTotal').textContent = currentCurrency === 'SYP' ? `${total} ل.س` : `${total} TL`;
    }

    function sendOrderWhatsApp() {
      if (cart.length === 0) return;
      let text = `*طلب جديد من مطعم حنين برغر:*%0A----------------------%0A`;
      
      const counts = {};
      cart.forEach(item => {
        counts[item.name] = (counts[item.name] || 0) + 1;
      });

      for (const [name, qty] of Object.entries(counts)) {
        text += `• ${name} (عدد ${qty})%0A`;
      }

      const total = cart.reduce((sum, item) => sum + (currentCurrency === 'SYP' ? item.syp : item.tl), 0);
      const currText = currentCurrency === 'SYP' ? 'ل.س' : 'TL';
      text += `----------------------%0A*الإجمالي:* ${total} ${currText}`;

      window.open(`https://wa.me/963938671515?text=${text}`, '_blank');
    }

    // تشغيل القائمة تلقائياً
    window.addEventListener('DOMContentLoaded', () => {
      renderMenu();
    });
  </script>
</body>
</html>
