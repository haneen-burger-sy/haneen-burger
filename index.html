<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم حنين برغر | Haneen Burger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e63946;
      --primary-hover: #d62828;
      --dark: #1d3557;
      --light-bg: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #2b2d42;
      --text-muted: #6c757d;
      --border-color: #edf2f4;
      --radius: 14px;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--light-bg);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 110px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1d3557 0%, #0d1b2a 100%);
      color: white;
      text-align: center;
      padding: 22px 16px 18px;
      border-radius: 0 0 26px 26px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    /* الشعار المفرغ الأصلي */
    .logo-wrapper {
      width: 95px;
      height: 105px;
      margin: 0 auto 8px;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4));
      transition: transform 0.3s ease;
    }

    .badge-top {
      display: inline-block;
      background: rgba(230, 57, 70, 0.25);
      color: #ffb703;
      border: 1px solid rgba(255, 183, 3, 0.4);
      padding: 3px 14px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    header h1 {
      font-size: 1.85rem;
      font-weight: 900;
      margin-bottom: 4px;
    }

    header p {
      color: #e0e1dd;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* أزرار العملة */
    .currency-switch {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.12);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .currency-btn {
      background: none;
      border: none;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .currency-btn.active {
      background: #ffb703;
      color: #1d3557;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* شريط الأقسام */
    .categories-bar {
      display: flex;
      gap: 8px;
      padding: 16px 12px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* شبكة الوجبات */
    .section-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--dark);
      margin: 14px 14px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 10px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card-img {
      width: 62px;
      height: 62px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: #eee;
    }

    .card-info {
      flex: 1;
      overflow: hidden;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed #edf2f4;
      padding-top: 8px;
      margin-top: auto;
    }

    .card-price {
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--primary);
    }

    .add-btn {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-btn:active {
      background: var(--primary);
      color: #ffffff;
      transform: scale(0.95);
    }

    /* شريط السلة العائم */
    .cart-bar {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: #1d3557;
      color: #ffffff;
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      z-index: 1000;
      cursor: pointer;
    }

    .cart-summary {
      display: flex;
      flex-direction: column;
    }

    .cart-count {
      font-size: 0.78rem;
      color: #ffb703;
      font-weight: 700;
    }

    .cart-total {
      font-size: 1.05rem;
      font-weight: 900;
    }

    .open-cart-btn {
      background: #e63946;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* نافذة مراجعة السلة والطلب */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      padding: 16px 20px;
      background: #f8f9fa;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--dark);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.6rem;
      line-height: 1;
      color: #888;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
    }

    .cart-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f1f3f5;
    }

    .item-title-col {
      flex: 1;
    }

    .item-name {
      font-size: 0.9rem;
      font-weight: 800;
      color: #111;
    }

    .item-single-price {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: #f8f9fa;
      color: var(--dark);
      font-size: 1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .qty-btn.plus {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .qty-number {
      font-weight: 800;
      font-size: 0.95rem;
      min-width: 18px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--dark);
    }

    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      border-color: var(--primary);
    }

    .modal-footer {
      padding: 14px 20px;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
    }

    .modal-total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--dark);
    }

    .submit-order-btn {
      width: 100%;
      background: #25d366;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <!-- اللوغو الأصلي المفرغ -->
    <div class="logo-wrapper">
      <svg viewBox="0 0 200 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <path id="burgerCurve" d="M 44,158 A 82,82 0 0,0 156,158" fill="none" />
        </defs>

        <!-- الإطار الدائري الذهبي مع الفتحة السفلية -->
        <path d="M 154,152 A 80,80 0 1,0 46,152" fill="none" stroke="#f5a623" stroke-width="7" stroke-linecap="round" />

        <!-- الدائرة الحمراء الداخلية -->
        <circle cx="100" cy="94" r="66" fill="#9e1a24" />

        <!-- خبزة البرغر العلوية المبتسمة -->
        <path d="M 68,68 C 68,44 132,44 132,68 Z" fill="none" stroke="#f5a623" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
        <path d="M 80,57 C 82,53 88,53 90,57" fill="none" stroke="#f5a623" stroke-width="3.5" stroke-linecap="round" />
        <path d="M 110,57 C 112,53 118,53 120,57" fill="none" stroke="#f5a623" stroke-width="3.5" stroke-linecap="round" />
        <path d="M 94,62 C 96,67 104,67 106,62" fill="none" stroke="#f5a623" stroke-width="3.5" stroke-linecap="round" />

        <!-- كلمة حنين الأصلية -->
        <text x="100" y="112" text-anchor="middle" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="900" font-size="36">حنين</text>

        <!-- تفاصيل البرغر السفلية -->
        <path d="M 108,121 Q 114,116 120,121 Q 126,126 132,121" fill="none" stroke="#f5a623" stroke-width="4" stroke-linecap="round" />
        <line x1="82" y1="126" x2="132" y2="126" stroke="#f5a623" stroke-width="4" stroke-linecap="round" />
        <path d="M 70,129 H 130 C 130,140 122,143 100,143 C 78,143 70,140 70,129 Z" fill="none" stroke="#f5a623" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />

        <!-- كلمة BURGER المقوسة في الأسفل -->
        <text fill="#f5a623" font-family="'Cairo', sans-serif" font-weight="900" font-size="20" letter-spacing="3.5">
          <textPath href="#burgerCurve" startOffset="50%" text-anchor="middle">BURGER</textPath>
        </text>
      </svg>
    </div>

    <div class="badge-top">⭐ جودة ونكهة مميزة</div>
    <h1>مطعم حنين برغر</h1>
    <p>الطعم اللي يرضيك • أهلاً وسهلاً بكم</p>
    
    <div class="currency-switch">
      <button class="currency-btn active" id="btn-syp" onclick="changeCurrency('SYP')">🇸🇾 ليرة سورية</button>
      <button class="currency-btn" id="btn-tl" onclick="changeCurrency('TL')">🇹🇷 TL تركي</button>
    </div>
  </header>

  <!-- أزرار الأقسام -->
  <div class="categories-bar">
    <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
    <button class="cat-btn" onclick="filterCategory('burger', this)">🍔 قسم البرغر</button>
    <button class="cat-btn" onclick="filterCategory('meals', this)">🍟 قسم الوجبات</button>
    <button class="cat-btn" onclick="filterCategory('sandwiches', this)">🌯 قسم السندويش</button>
    <button class="cat-btn" onclick="filterCategory('drinks', this)">🥤 المشروبات</button>
  </div>

  <!-- حاوية القائمة -->
  <main id="menu-container"></main>

  <!-- شريط السلة العائم -->
  <div class="cart-bar" id="cartBar" style="display: none;" onclick="openCartModal()">
    <div class="cart-summary">
      <span class="cart-count" id="cartCount">0 وجبات محددة</span>
      <span class="cart-total" id="cartTotal">0 ل.س</span>
    </div>
    <button class="open-cart-btn">
      <span>عرض وتعديل السلة</span>
      🛒
    </button>
  </div>

  <!-- نافذة مراجعة السلة والبيانات -->
  <div class="modal-overlay" id="cartModal" onclick="closeCartModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">🛒 سلة المشتريات ومراجعة الطلب</div>
        <button class="modal-close" onclick="closeCartModal()">&times;</button>
      </div>
      
      <div class="modal-body">
        <!-- قائمة الوجبات مع أزرار الزيادة والنقصان -->
        <div class="cart-items-list" id="modalCartItems"></div>

        <hr style="border: none; border-top: 1px dashed var(--border-color); margin: 16px 0;">

        <!-- 1. الاسم -->
        <div class="form-group">
          <label>👤 الاسم الكريم:</label>
          <input type="text" id="custName" placeholder="مثال: محمود" required>
        </div>

        <!-- 2. الرقم -->
        <div class="form-group">
          <label>📞 رقم الهاتف (للتواصل والتأكيد):</label>
          <input type="tel" id="custPhone" placeholder="مثال: 0938123456" dir="ltr" style="text-align: right;" required>
        </div>
        
        <!-- 3. العنوان -->
        <div class="form-group">
          <label>📍 العنوان أو مكان التوصيل:</label>
          <input type="text" id="custAddress" placeholder="مثال: الدانا - جانب الجامع الكبير" required>
        </div>

        <!-- 4. الملاحظات -->
        <div class="form-group">
          <label>📝 ملاحظات إضافية على الطلب:</label>
          <textarea id="custNotes" rows="2" placeholder="مثال: بلا توم، شطة زيادة، بدون مخلل..."></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <div class="modal-total-row">
          <span>المجموع الكلي:</span>
          <span id="modalTotal" style="color: var(--primary);">0 ل.س</span>
        </div>
        <button class="submit-order-btn" onclick="sendOrderWhatsApp()">
          <span>تثبيت وإرسال الطلب عبر واتساب</span>
          💬
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentCurrency = 'SYP';
    let currentFilter = '
